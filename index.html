 users:'<circle cx="9" cy="8" r="4"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a4 4 0 0 1 0 8m1 5a5 5 0 0 1 4 4"/>',

 file:'<path d="M6 3h9l5 5v13H6z"/><path d="M15 3v6h5M9 13h8M9 17h8"/>',
 lab:'<path d="M9 3h6M10 3v7l-6 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3"/><path d="M7 16h10"/>',
 quiz:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 2 2 4-4M8 16h8"/>',
 book:'<path d="M5 4h14a2 2 0 0 1 2 2v15H7a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1Z"/><path d="M4 18a3 3 0 0 1 3-3h14"/>',
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',

 info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-8h.01"/>',

 pause:'<path d="M9 5v14M15 5v14"/>',
 lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 alert:'<path d="m10 3-9 16h22L14 3a2 2 0 0 0-4 0Z"/><path d="M12 9v4m0 3h.01"/>',
 tree:'<circle cx="12" cy="4" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 6v7M5 17v-4h14v4"/>',

const textOnly=s=>String(s).replace(/<[^>]*>/g,'').replace(/&[^;]*;/g,' ');
const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const call=(content,mode='')=>`<div class="callout ${mode}">${content}</div>`;
const list=items=>`<ul>${items.map(s=>`<li>${s}</li>`).join('')}</ul>`;
const code=s=>`<div class="code-line">${s}</div>`;
const modules=[
{id:'types',num:'01',title:'概念与事件分类',track:'cross',desc:'内中断、外中断、同步 / 异步、Fault / Trap / Abort',keywords:'中断 外中断 内中断 异常 可屏蔽中断 不可屏蔽中断 故障 自陷 终止 IRQ NMI trap fault abort',tips:['广义中断包含异常与外中断','外中断通常异步，异常通常同步','缺页是 Fault；系统调用常按 Trap 理解','NMI 不受普通 IF 位屏蔽'],sections:[
['什么是中断与异常',`<p><strong>中断机制</strong>使 CPU 在执行正常程序时，能够转入特定的事件处理流程。事件可能来自外部设备，也可能由正在执行的指令引起。</p>${table(['类型','来源','时间特点','例子'],[['外中断（狭义中断）','CPU 外部','通常异步','时钟、键盘、I/O 完成'],['异常（内中断）','当前指令的执行','通常同步','缺页、非法操作、系统调用']])}${call('关键思路：<strong>外中断是外部事件来通知 CPU，异常是 CPU 执行当前指令时发现或主动触发的事件。</strong>')}`],
['外中断：可屏蔽与不可屏蔽',`${table(['分类','特点','典型用途'],[['普通可屏蔽中断（IRQ/INTR）','受中断允许位、屏蔽控制与优先级等条件约束','设备完成 I/O、时钟事件等'],['不可屏蔽中断（NMI）','不受普通可屏蔽中断允许位 IF 控制','严重硬件事件等']])}<p>这里的“可屏蔽”指硬件中断源，<strong>不意味着全部中断和异常都受关中断控制</strong>。</p>`],
['异常三分类：Fault、Trap、Abort',`${table(['异常类型','特点','恢复点 / 后果'],[['Fault（故障）','执行当前指令时发现，通常有修复机会','故障解决后一般重新执行当前指令；缺页为典型例子'],['Trap（自陷）','主动或有意触发的异常入口','一般从下一条指令继续；系统调用为典型例子'],['Abort（终止）','严重、往往无法精确恢复的错误','通常不能恢复原程序的正常执行']])}${call('典型陷阱：缺页处理成功后要<strong>重新执行触发缺页的指令</strong>，不是一律从下一条开始。', 'warning')}`],
['与 408 题目结合',`<p>考试喜欢把“系统调用、缺页、DMA 传输完成、打印机缺纸”等并列，让你分别判断属于内中断还是外中断、是否同步、返回位置是否相同。</p><p><strong>不能仅凭“程序进入内核”判断它是哪一种事件。</strong>系统调用、缺页与设备中断都可能进入内核，但触发原因不同。</p>`]
]},
{id:'cpu',num:'02',title:'CPU 检测与响应',track:'co',desc:'中断请求、响应周期、中断隐指令、断点与中断向量',keywords:'指令周期 中断周期 中断响应周期 中断隐指令 保存断点 PSW PC 保护现场 中断向量 向量表',tips:['普通外中断通常在指令结束后检测','中断隐指令是硬件动作，不是一条程序指令','保存断点 ≠ 保存全部现场','中断向量用于定位服务程序'],sections:[
['中断响应的基本顺序',`<p>以普通可屏蔽外中断为例：</p>${code('中断源发请求 → CPU 检测 → 判断是否允许响应\n→ 进入中断响应周期 → 执行中断隐指令\n→ 中断服务程序 → 恢复状态 / 调度 → 中断返回')}<p>普通外中断的响应检测一般在一条指令执行结束之后；而缺页等同步异常可能在指令执行期间发现，不能机械套用这个时序。</p>`],
['中断隐指令：硬件自动完成',`${table(['操作','作用'],[['关中断（教材常用模型）','短暂禁止普通可屏蔽中断再打断当前响应过程'],['保存断点','保存恢复执行所需的位置，通常与 PC 等状态有关'],['引出中断服务程序','根据中断源或中断类型确定处理程序入口']])}${call('<strong>中断隐指令不是指令系统中由程序员写出的独立机器指令</strong>，而是一组硬件自动执行的动作。不同体系结构的硬件保存范围可能不一样。')}`],
['断点与现场：一定要区分',`${table(['术语','含义','常见保存方式'],[['断点','后续应从哪里继续执行，核心是 PC / 返回地址','硬件中断响应时保存'],['现场','程序执行上下文：通用寄存器、处理器状态等','部分由硬件保存，其他由服务程序保存'],['进程上下文','进程恢复运行所需的更完整状态','进程切换时由内核管理']])}<p>一次中断不一定导致进程切换，但无论是否切换，都必须保证被中断程序恢复后语义正确。</p>`],
['中断向量与中断向量表',`<p><strong>中断向量</strong>通常指中断服务程序入口地址；<strong>中断向量地址</strong>是存放中断向量的表项位置；<strong>中断向量表</strong>包含多个入口信息。</p>${code('中断类型号 / 中断号 → 查中断向量表 → 处理程序入口地址 → 跳转执行')}${call('选择题容易问“中断向量”和“中断向量地址”的差别：<strong>一个是服务程序的入口，一个是存放入口信息的地址。</strong>','warning')}`]
]},
{id:'nested',num:'03',title:'多重中断与屏蔽',track:'co',desc:'开关中断、屏蔽字、响应优先级与处理优先级',keywords:'多重中断 中断嵌套 响应优先级 处理优先级 屏蔽字 开中断 关中断 IF IE',tips:['开中断是响应可屏蔽中断的重要前提','响应周期内可自动关中断','支持嵌套时服务程序可重新开中断','响应优先级与处理优先级不是一个概念'],sections:[
['单重中断与多重中断',`<p><strong>单重中断</strong>：处理中断 B 期间不允许普通可屏蔽中断再次进入。<strong>多重中断</strong>：处理中断 B 时，可以允许满足条件的中断 C 抢占执行，形成中断嵌套。</p>${code('进程 A → ISR(B) → ISR(C) → 返回 ISR(B) → 返回进程 A')}<p>实现嵌套通常需要：保存当前现场、适时开中断、按优先级和屏蔽关系判断能否嵌套，完成后逐层恢复。</p>`],
['三个完全不同的控制概念',`${table(['概念','含义'],[['关中断','全局上暂时禁止普通可屏蔽中断的响应'],['开中断','允许 CPU 响应符合条件的普通可屏蔽中断'],['中断屏蔽','选择性禁止某些中断源的请求被响应']])}<p>即使<strong>开中断</strong>，某个中断请求也可能因为被屏蔽而不被响应。即使<strong>关中断</strong>，CPU 仍可能发生缺页等同步异常，也不意味着 NMI 被禁止。</p>`],
['响应优先级与处理优先级',`${table(['对比','中断响应优先级','中断处理优先级'],[['决定什么','同时出现多个请求，先响应哪个','当前服务程序可被哪个中断打断'],['主要依据','硬件优先级和仲裁机制','硬件约束与中断屏蔽关系'],['408 常用模型','通常较固定','可通过屏蔽字调整嵌套关系']])}<p>中断屏蔽字中 1 / 0 的含义，以题目约定为准；教材题常用 <strong>1 表示屏蔽，0 表示允许</strong>。</p>`],
['2021 年 408 真题 C 选项争议',`<p>原题选项：“进入中断响应周期时，CPU 一定处于中断允许（开中断）状态。”教材标准答案将 C 判正确。</p><p>按<strong>普通可屏蔽中断</strong>的经典前提解释：中断响应条件成立时需处于允许状态，才会进入中断响应周期。<strong>进入后</strong>执行中断隐指令又会自动关中断，两个时间点并不矛盾。</p>${call('严格说，“一定”与“进入时”的表述容易有歧义：NMI 不依赖普通 IF 位；中断响应周期内部也存在关中断后的状态。应按试题教材语境判题，不要误记成“整个中断响应周期始终开中断”。','warning')}`]
]},
{id:'kernel',num:'04',title:'中断与操作系统内核',track:'os',desc:'用户态、内核态、特权指令、系统调用与 Trap',keywords:'操作系统 用户态 内核态 管态 目态 系统调用 trap 自陷 特权指令 现场保护 中断处理程序',tips:['内核态也能响应新的符合条件的中断','系统调用是主动进入内核的机制','Trap 类系统调用在经典模型中属于同步异常','态切换不等于进程切换'],sections:[
['用户态与内核态',`${table(['用户态（User Mode）','内核态（Kernel Mode）'],[['执行普通应用程序','执行操作系统内核代码'],['不能直接执行大多数特权指令','能够执行特权指令'],['可发起系统调用','管理内存、设备、调度等内核功能'],['也能被中断','同样可以被符合条件的中断打断']])}${call('“只有在用户态，CPU 才能检测并响应中断”是错的。<strong>内核态也能响应中断</strong>，多重中断就可能在内核代码执行期间发生。')}`],
['系统调用与自陷',`<p>用户程序通过操作系统提供的系统调用接口请求内核服务。408 的经典机制中，自陷指令（Trap）使 CPU 从用户态转入内核态执行系统调用处理程序。</p>${code('用户程序调用 read()\n  → 发起系统调用（同步事件）\n  → CPU 进入内核态\n  → 内核检查请求，执行相应服务\n  → 返回用户态，继续运行')}<p><strong>Trap / 系统调用入口不等于普通设备外中断。</strong>不同实际体系结构可能使用不同的系统调用指令。</p>`],
['特权指令与中断使能',`<p>修改处理器中断允许状态、操作部分控制寄存器等，通常属于特权操作。用户态不能任意关闭系统中断或直接管理所有硬件。</p>${call('陷阱：<strong>用户程序可以执行专门的系统调用入口指令</strong>，不能据此认为所有能使 CPU 进入内核的指令都是禁止用户态执行的特权指令。','warning')}`],
['中断返回不是必然返回同一进程',`<p>操作系统处理事件后，可能直接恢复被中断的原程序；也可能发现需要重新调度，于是保存原进程上下文，恢复另一个进程的上下文。</p><p><strong>CPU 进入内核态、中断处理、进程上下文切换</strong>是三个不同层面的动作，不要直接画等号。</p>`]
]},
{id:'schedule',num:'05',title:'时钟中断与进程调度',track:'os',desc:'时间片、抢占、阻塞、唤醒以及上下文切换',keywords:'时钟中断 定时器 时间片 抢占 进程调度 进程切换 就绪态 运行态 阻塞态 唤醒 I/O',tips:['时钟中断提供调度检查时机','中断不必然导致进程切换','I/O 完成唤醒通常进入就绪态','中断处理现场 ≠ 进程切换上下文'],sections:[
['时钟中断为什么重要',`<p>定时器周期性或按配置时刻产生硬件事件。CPU 响应后，操作系统可更新计时信息、检查时间片及调度需求。</p>${code('进程 A 正在运行 → 时钟中断 → 内核检查时间片\n→ 若需要抢占：A 运行态→就绪态；选择 B 运行\n→ 若无需抢占：恢复 A 继续运行')}${call('<strong>时钟中断不是进程切换的同义词</strong>。即使发生时钟中断，原进程也可能继续运行。')}`],
['I/O 阻塞与完成中断',`${table(['事件','典型状态变化'],[['进程需要等待 I/O','运行态 → 阻塞态'],['设备完成 I/O，产生中断并被内核处理','等待进程：阻塞态 → 就绪态'],['调度器选中该进程','就绪态 → 运行态'],['时间片耗尽，需要抢占','运行态 → 就绪态']])}<p>I/O 完成后进程通常先进入<strong>就绪态</strong>，是否立即运行取决于调度策略和当前运行进程。</p>`],
['中断与进程切换差异',`<p>中断处理使 CPU 转去处理一个事件；进程切换需要操作系统保存与恢复进程上下文，并更新进程运行状态。</p><p>有中断未必切换进程；进程切换也可能由系统调用导致的阻塞引发，而非外设中断直接触发。</p>`],
['中断与临界区',`<p>在单处理器环境中，内核可暂时屏蔽中断来避免关键代码被普通中断打断。但在多处理器环境中，仅屏蔽当前 CPU 的中断不足以实现跨 CPU 的共享数据互斥。</p><p>因此 <strong>关中断、互斥锁、信号量 P/V</strong> 是相关但不同的同步工具。</p>`]
]},
{id:'memory',num:'06',title:'缺页与存储异常',track:'cross',desc:'MMU、TLB Miss、Cache Miss、Page Fault 与异常返回',keywords:'虚拟内存 缺页 页表 TLB cache MMU 缺页异常 页面置换 指令重执行',tips:['TLB Miss 不一定是 Page Fault','Cache Miss 通常由硬件处理','缺页修复后通常重执行当前指令','非法地址访问未必可以正常修复'],sections:[
['缺页异常的完整过程',`<p>CPU 访问虚拟地址时，MMU 检查页表等转换信息。若发现所需页面未驻留在主存且可以调入，会产生缺页异常，进入操作系统缺页处理程序。</p>${code('CPU 访存 → 地址转换 → 发现页不在内存\n→ 产生 Page Fault → 进入内核缺页处理程序\n→ 分配页框 / 页面置换 / 必要时从外存调入\n→ 更新页表、相关缓存状态 → 重新执行故障指令')}<p>等待磁盘调页期间，缺页进程可能阻塞，由其他进程占用 CPU。</p>`],
['TLB Miss、Cache Miss、Page Fault 区别',`${table(['事件','含义','是否必须由操作系统处理'],[['Cache Miss','高速缓存中没有目标数据','通常不需要，硬件完成逐级访存'],['TLB Miss','TLB 没有目标地址转换项','不一定，可能硬件查页表，也可能软件填 TLB'],['Page Fault','触发缺页处理条件的异常','需要进入异常处理，可能调页或判定访问错误']])}${call('<strong>TLB Miss ≠ 缺页</strong>：若页表显示页面已经在内存，只是 TLB 不包含该表项，补上转换信息即可。','warning')}`],
['访问异常与缺页不完全相同',`<p>非法虚拟地址、越权访问以及缺失页面，均可能触发处理器的内存相关异常；并非所有情况都能通过“从外存调入一页”修复。</p><p>408 常见的“缺页后重新执行当前指令”结论，应理解为<strong>合法缺页且成功处理</strong>的情况。</p>`],
['缺页与进程调度如何关联',`<p>当缺页需要较慢的存储设备 I/O 时，操作系统可以阻塞当前进程，调度其他就绪进程；I/O 完成中断则可唤醒缺页进程，随后才有机会重新执行故障指令。</p>${call('一条缺页流程，可能同时考：<strong>MMU（计组）+ 缺页处理（OS）+ I/O 完成中断（计组）+ 进程唤醒与调度（OS）</strong>。')}`]
]},
{id:'io',num:'07',title:'I/O 中断与 DMA',track:'cross',desc:'程序查询、中断驱动、DMA 请求与设备中断',keywords:'程序查询 中断驱动 DMA 通道 I/O 设备 总线控制权 周期挪用 中断通知',tips:['程序查询靠 CPU 轮询设备状态','中断驱动靠设备主动通知 CPU','DMA 传输主要不经 CPU 逐字搬运','DMA 总线请求 ≠ CPU 中断请求'],sections:[
['三种重要的 I/O 控制方式',`${table(['方式','数据传输 / CPU 行为','如何知道完成'],[['程序查询','CPU 不断检查设备状态，参与数据传送','CPU 轮询状态'],['中断驱动','CPU 可先执行其他工作，设备需要服务时触发中断','设备发送中断请求'],['DMA','DMA 控制器负责设备与主存之间的数据块传送','通常由完成中断告知 CPU']])}<p>DMA 减少 CPU 的逐字搬运负担，但 CPU 往往仍需负责初始化传输及处理完成事件。</p>`],
['DMA 请求与中断请求有什么区别',`${table(['DMA 请求','中断请求'],[['请求获得传输所需的总线 / 存储器访问机会','请求 CPU 执行相应的事件处理程序'],['数据传送过程的控制','处理事件、更新状态或唤醒进程'],['可能与 CPU 访存竞争','需要满足相应的中断响应条件']])}${call('DMA 周期挪用可能导致 CPU 访存暂时等待，但这<strong>不是“CPU 执行了中断隐指令”</strong>。','warning')}`],
['一次 read() 的全链路',`${code('用户进程 A 调用 read()\n→ 系统调用进入内核\n→ 内核启动磁盘 I/O / DMA\n→ A 等待 I/O，进入阻塞态\n→ CPU 调度进程 B\n→ DMA 完成传输，设备发送完成中断\n→ CPU 响应，内核处理中断、唤醒 A\n→ A 进入就绪态，等待 CPU 调度\n→ A 恢复执行并从 read() 返回')}<p>这是最值得反复复盘的“计组 + 操作系统”综合案例。</p>`]
]},
{id:'integrated',num:'08',title:'跨章节综合与易错点',track:'cross',desc:'完整中断链路、2021 真题辨析、核心速查清单',keywords:'综合题 考点汇总 易错 真题 2021 中断响应 C选项 知识点联系',tips:['判断题先确定中断还是异常','再看是否受 IF 与屏蔽影响','最后分析返回指令与进程状态','避免把硬件行为与内核策略混同'],sections:[
['综合场景：时钟中断 + 缺页',`<p><strong>第一段：</strong>CPU 执行进程 A；定时器发中断；内核在时钟中断处理后发现时间片耗尽，调度进程 B。</p><p><strong>第二段：</strong>B 访存时缺页；CPU 产生同步异常，转入缺页处理程序；若需磁盘调页，B 可阻塞。</p><p><strong>第三段：</strong>DMA 完成读盘，发出 I/O 完成中断；内核唤醒 B，B 从阻塞态变就绪态；以后得到 CPU 才重执行缺页指令。</p>${call('同一个综合过程可涉及：中断隐指令、开关中断、时钟中断、进程切换、MMU、Page Fault、DMA、中断驱动 I/O、阻塞唤醒。')}`],
['最常见的错误判断',`${table(['容易误判的说法','正确结论'],[['只有用户态可以响应中断','错：内核态同样可以响应符合条件的中断'],['关中断能阻止全部异常','错：缺页等同步异常并不受普通 IF 控制'],['执行中断隐指令要保存全部现场','错：必要硬件状态与软件保存的现场需区分'],['发生外中断必然产生进程切换','错：可能恢复原进程'],['DMA 不需要中断','错：完成时通常使用中断通知 CPU'],['TLB Miss 就是缺页','错：页面可能已经在主存'],['缺页处理完直接执行下一条指令','错：通常需要重执行故障指令'],['中断响应优先级等于处理优先级','不一定：由不同机制决定']])}`],
['答题的四步判断法',`${list(['<strong>看来源：</strong>外部设备还是当前指令？外中断还是异常？','<strong>看条件：</strong>是否可屏蔽？IF、屏蔽位、优先级是否允许？','<strong>看硬件：</strong>CPU 保存什么、关不关中断、跳转到哪里？','<strong>看系统：</strong>内核做什么？进程是阻塞、就绪还是运行？返回当前指令还是下一条？'])}<p>这四个问题比背零散的“正确 / 错误”判断更可靠。</p>`]
]}
];

{id:'q02',m:'types',q:'对普通中断允许位（IF/IE）的理解，正确的是？',o:['关中断可以禁止任何异常','NMI 通常不受普通 IF 位控制','系统调用一定被 IF=0 阻止','Cache Miss 一定触发中断'],a:1,e:'NMI 不受普通可屏蔽中断允许位控制；缺页及系统调用等同步异常一般也不受它的限制。'},

function moduleView(id){let m=modules.find(x=>x.id===id);if(!m)return homeView();return `<div class="page-intro"><div class="eyebrow">CHAPTER ${m.num} / 08</div><div class="page-title-row"><div><h1>${m.title}</h1><p class="lead">${m.desc}。按知识点逐层理解，重点区分硬件响应和操作系统处理的职责。</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${trackBadge(m.track)}${completed(m.id)?'<span class="pill done">已掌握 ✓</span>':'<span class="pill note">待学习</span>'}</div></div><button class="btn btn-outline btn-small no-print" data-action="print">${ic('file')} 打印 / 导出 PDF</button></div></div><div class="article-layout"><div class="article-main">${m.sections.map((s,i)=>`<article class="card lesson" id="section-${i}"><h3><span style="color:#8aabaf;font-size:12px;font-weight:800">${String(i+1).padStart(2,'0')}</span> ${s[0]}</h3>${s[1]}</article>`).join('')}<div class="card" style="padding:22px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><strong>完成本章了吗？</strong><p style="font-size:12px;color:#7a8a9b;margin:4px 0 0">继续深入、进行本章训练，或返回知识树。</p></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-quiet" data-page="map">知识树</button><button class="btn btn-primary" data-action="quiz-module" data-id="${id}">本章练习 ${ic('arrow')}</button></div></div></div><aside class="article-aside"><div class="card aside-card"><h4>本章要抓住的关键点</h4><ul class="aside-tips">${m.tips.map(t=>`<li>${t}</li>`).join('')}</ul><button class="btn ${completed(id)?'mastered':'btn-primary'} aside-action" data-action="toggle-done" data-id="${id}">${ic(completed(id)?'check':'target')} ${completed(id)?'已掌握 · 点击取消':'标记为已掌握'}</button></div><div class="card aside-card"><h4>我的本章笔记</h4><textarea class="note-field" id="chapterNotes" data-note="${id}" placeholder="记录你自己的理解、题目陷阱或错题总结...">${escapeHtml(saved.notes[id]||'')}</textarea><p class="note-hint">输入时自动保存在当前浏览器；不同浏览器之间不共享。</p></div><div class="card aside-card"><h4>章节目录</h4><div class="module-index">${m.sections.map((s,i)=>`<button class="index-chip" data-action="scroll-section" data-index="${i}">${i+1}. ${s[0]}</button>`).join('')}</div></div></aside></div>`}
function labView(){let s=flowSteps[stepIndex];return `<div class="page-intro"><div class="eyebrow">INTERACTIVE LAB / 02</div><h1>中断流程实验室</h1><p class="lead">不是只背“检测 → 关中断 → 处理”。亲自切换步骤与允许位，理解为什么中断响应的时间点如此重要。</p></div><div class="lab-layout"><section class="card lab-panel"><div class="step-counter">INTERRUPT EXECUTION / STEP ${String(stepIndex+1).padStart(2,'0')} OF 07</div><div class="step-dot-row">${flowSteps.map((_,i)=>`<button class="step-dot ${i===stepIndex?'active':i<stepIndex?'past':''}" data-action="goto-step" data-index="${i}" title="步骤 ${i+1}"></button>`).join('')}</div><div class="flow-scene"><div class="scene-icon">${ic(s.icon)}</div><h2>${s.title}</h2><p>${s.desc}</p><div class="scene-meta">${s.tags.map(t=>`<span class="pill cross">${t}</span>`).join('')}</div></div><div class="insight-row">${ic('info')}<div><strong>这个步骤要记住什么？</strong><p>${s.detail}</p></div></div><div class="lab-controls"><button class="btn btn-outline" data-action="prev-step" ${stepIndex===0?'disabled':''}>← 上一步</button><button class="btn btn-primary" data-action="next-step">${stepIndex===flowSteps.length-1?'重新演示 ↻':'下一步 →'}</button></div><div class="lab-mini"><h4>区分“响应条件”和“响应动作”</h4><div class="timeline-ticks">${flowSteps.map((_,i)=>`<div class="tick ${i<stepIndex?'on':i===stepIndex?'now':''}"></div>`).join('')}</div><div class="time-labels"><span>中断产生</span><span>响应周期</span><span>中断返回</span></div><p style="margin-top:12px">在普通可屏蔽外中断的教材模型中：进入响应前需满足允许中断；进入响应周期后硬件会执行关中断动作。</p></div></section><aside><section class="card lab-panel"><h3>CPU 中断响应条件实验</h3><p class="section-sub">调整条件，观察 CPU 是否能响应当前事件。</p><div class="control-line"><label for="iftoggle">允许普通可屏蔽中断（IF=1）</label><label class="switch"><input type="checkbox" id="iftoggle" ${irqIF?'checked':''}/><span class="switch-slider"></span></label></div><div class="control-line"><label for="masktoggle">当前 IRQ 被屏蔽</label><label class="switch"><input type="checkbox" id="masktoggle" ${irqMasked?'checked':''}/><span class="switch-slider"></span></label></div><div style="font-size:12px;color:#536c80;font-weight:720;margin-top:17px">选择事件类型</div><div class="radio-pills">${[['irq','普通 IRQ'],['nmi','NMI'],['fault','缺页异常']].map(([id,l])=>`<button class="radio-pill ${irqType===id?'on':''}" data-action="irq-type" data-id="${id}">${l}</button>`).join('')}</div><div id="irqResult">${irqResultMarkup()}</div></section><section class="card lab-panel" style="margin-top:15px"><h3>中断嵌套判断</h3><p class="section-sub">设当前 ISR 处理优先级为 2；数字越小优先级越高，且已适时开中断，没有额外屏蔽。</p><div class="radio-pills">${[1,2,3].map(n=>`<button class="radio-pill ${incomingPriority===n?'on':''}" data-action="priority" data-id="${n}">新中断优先级 ${n}</button>`).join('')}</div><div class="lab-result"><strong>${incomingPriority<2?'允许按优先级嵌套':'通常不允许按该优先级抢占'}</strong><p>${incomingPriority<2?'当前 ISR 优先级 2，新中断优先级 1 更高；在开中断且未屏蔽的前提下，可抢占当前 ISR。':'当前 ISR 优先级为 2，新中断不高于当前中断；按本实验的严格高优先级抢占规则，不能抢占。实际还需看硬件和屏蔽配置。'}</p></div></section></aside></div>`}
function irqResultMarkup(){let good=irqType==='irq'?irqIF&&!irqMasked:true;let cls=good?'':'warning';let t=irqType==='irq'?(good?'可以响应普通可屏蔽中断':'暂不能响应这个普通 IRQ'):irqType==='nmi'?'NMI 不受普通 IF 位屏蔽':'缺页异常不依赖普通 IF 位';let d=irqType==='irq'?(good?'IF 允许且本 IRQ 未被屏蔽；仍可能受其他响应条件、优先级和响应时机约束。':!irqIF?'IF=0：该普通可屏蔽中断暂不能进入响应；请求能否保留取决于设备与控制器。':'当前 IRQ 已被屏蔽，即使 IF=1 也不能按此条件响应。'):irqType==='nmi'?'NMI 属于不可屏蔽中断，不受这里模拟的普通 IF / IRQ 屏蔽条件控制。':'这是当前指令触发的同步异常；即使 IF=0，也可以进入相应的异常处理流程。';return `<div class="lab-result ${cls}"><strong>${good?'✓':'!'} ${t}</strong><p>${d}</p></div>`}
function quizStart(filter='all',wrongOnly=false){let pool=quizBank.filter(q=>(filter==='all'||q.m===filter)&&(!wrongOnly||saved.wrong.includes(q.id)));quiz={ids:pool.map(q=>q.id),answers:{},submitted:false,mode:wrongOnly?'wrong':'all',filter};changePage('quiz')}
function quizView(){if(!quiz.ids.length&&quiz.mode==='all')quiz.ids=quizBank.map(q=>q.id);let qs=quiz.ids.map(id=>quizBank.find(x=>x.id===id)).filter(Boolean);let count=Object.keys(quiz.answers).length;let score=qs.filter(q=>quiz.answers[q.id]===q.a).length;return `<div class="page-intro"><div class="eyebrow">PRACTICE / 03</div><h1>408 中断综合自测</h1><p class="lead">单选题覆盖 8 大模块。交卷后逐题显示解释，并自动收集答错的题目；错题可单独重练。</p></div><div class="quiz-toolbar"><div style="display:flex;gap:9px;flex-wrap:wrap"><select class="select" id="quizFilter" aria-label="筛选练习章节"><option value="all" ${quiz.filter==='all'?'selected':''}>全部章节（${quizBank.length} 题）</option>${modules.map(m=>`<option value="${m.id}" ${quiz.filter===m.id?'selected':''}>${m.num} ${m.title}</option>`).join('')}</select><button class="btn btn-outline btn-small" data-action="quiz-restart">${ic('refresh')} 重新开始</button></div><button class="tiny-link" data-page="wrong">错题本 ${saved.wrong.length} 题 ${ic('arrow')}</button></div>${qs.length?`${quiz.submitted?`<div class="quiz-summary"><div><h2>本次测验完成</h2><p>${score===qs.length?'全部回答正确，当前内容掌握良好。':`答对 ${score} 题，答错 ${qs.length-score} 题。点击相关章节复习后可再测。`}</p></div><div class="score-large">${Math.round(score/qs.length*100)}%</div></div>`:''}${qs.map((q,i)=>`<section class="card quiz-item"><div class="question-top"><span class="question-num">QUESTION ${String(i+1).padStart(2,'0')} / ${String(qs.length).padStart(2,'0')}</span>${trackBadge(modules.find(m=>m.id===q.m)?.track||'cross')}</div><h3>${q.q}</h3><div class="options">${q.o.map((op,j)=>`<button class="option ${quiz.submitted?(j===q.a?'correct':quiz.answers[q.id]===j?'wrong':''):quiz.answers[q.id]===j?'selected':''}" data-action="answer" data-id="${q.id}" data-index="${j}" ${quiz.submitted?'disabled':''}><span class="op-letter">${String.fromCharCode(65+j)}</span><span>${op}</span></button>`).join('')}</div>${quiz.submitted?`<div class="explain"><b>${quiz.answers[q.id]===q.a?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${String.fromCharCode(65+q.a)}</b><div>${q.e}</div><button class="tiny-link" data-module="${q.m}">回到相关章节 ${ic('arrow')}</button></div>`:''}</section>`).join('')}<div class="quiz-bottom"><span style="font-size:12px;color:#687f90">${quiz.submitted?`正确 ${score} / ${qs.length} · 错题已整理`:`已完成 ${count} / ${qs.length} 题`}</span>${quiz.submitted?`<button class="btn btn-primary" data-action="quiz-restart">再做一次 ${ic('refresh')}</button>`:`<button class="btn btn-primary" data-action="submit-quiz" ${count!==qs.length?'disabled':''}>提交试卷 ${ic('arrow')}</button>`}</div>`:`<div class="card error-empty">${ic('book')}<h3>当前范围内没有题目</h3><p>换一个章节，或先完成一次综合自测。</p><button class="btn btn-primary" data-action="all-quiz">开始全部题目</button></div>`}`}
function wrongView(){let qs=quizBank.filter(q=>saved.wrong.includes(q.id));return `<div class="page-intro"><div class="eyebrow">REVIEW / 04</div><h1>我的错题本</h1><p class="lead">每次交卷会自动收录答错的题；你可以回到相关章节复习，再用“错题重练”检测是否掌握。</p></div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><div class="stat-value">${qs.length}<small>题</small></div><div class="stat-label">待复习错题</div></div><div class="stat"><div class="stat-value">${saved.history.length}<small>次</small></div><div class="stat-label">累计完成测验次数</div></div></div>${qs.length?`<div style="display:flex;gap:10px;margin-bottom:17px;flex-wrap:wrap"><button class="btn btn-primary" data-action="retry-wrong">${ic('refresh')} 错题重练</button><button class="btn btn-quiet" data-action="clear-wrong">清空错题记录</button></div><div class="grid-2">${qs.map((q,i)=>`<div class="card module-tile"><span class="pill note">错题 ${i+1}</span><strong>${q.q}</strong><p>${q.e}</p><div class="card-foot"><button class="tiny-link" data-module="${q.m}">复习知识点 ${ic('arrow')}</button><button class="btn btn-small btn-quiet" data-action="remove-wrong" data-id="${q.id}">已掌握</button></div></div>`).join('')}</div>`:`<div class="card error-empty">${ic('check')}<h3>当前没有待复习错题</h3><p>做一套中断综合题后，错误答案会自动整理到这里。</p><button class="btn btn-primary" data-action="all-quiz">开始综合练习</button></div>`}<div class="section-head"><div><h2>我的学习笔记</h2><p class="section-sub">从已记录的章节笔记中快速跳转。</p></div></div><div class="grid-2">${modules.filter(m=>saved.notes[m.id]?.trim()).map(m=>`<div class="card module-tile" data-module="${m.id}"><span class="pill cross">${m.num} ${m.title}</span><p style="min-height:unset;margin-top:12px;white-space:pre-wrap">${escapeHtml(saved.notes[m.id].slice(0,180))}${saved.notes[m.id].length>180?'…':''}</p></div>`).join('')||'<p class="lead">还没有笔记。进入章节后可在右侧输入自己的理解。</p>'}</div>`}
const refs=[
['普通中断响应的两个时间点','进入前：响应条件需要允许普通可屏蔽中断；进入后：中断隐指令通常执行关中断。'],
['内核态也可响应中断','检测和响应中断并非用户态专属；多重中断系统尤其需要区分。'],
['中断隐指令 ≠ 保存全部现场','硬件负责保存必要处理器状态，通用寄存器等可能由服务程序保存。'],
['响应优先级 ≠ 处理优先级','同时请求的仲裁与处理中允许的嵌套，是不同的机制。'],
['系统调用 ≠ 普通 I/O 外中断','系统调用在经典模型中属于同步 Trap；I/O 完成是外部异步事件。'],
['缺页 ≠ TLB Miss','TLB 不命中未必缺页；合法缺页修复后通常重试当前指令。'],
['时钟中断 ≠ 进程切换','时钟中断让内核有机会检查调度需求，但不必每次更换进程。'],
['I/O 完成唤醒 ≠ 直接运行','等待进程通常从阻塞态转成就绪态，再由调度器决定是否运行。'],
['DMA 总线请求 ≠ CPU 中断请求','DMA 传输争用总线，完成通知才可能触发 CPU 中断处理。'],
['关本核中断 ≠ 多核互斥','关闭本核可屏蔽中断无法阻止其他 CPU 核心访问共享数据。'],
['从中断返回 ≠ 一定回原进程','操作系统可能在中断处理后调度另一个就绪进程。'],
['所有异常 ≠ 都可恢复','Fault 可能修复重试；Abort 往往不可恢复；非法访问不一定能通过调页解决。']
];
function referenceView(){return `<div class="page-intro"><div class="eyebrow">QUICK REVIEW / 05</div><h1>易错点速查</h1><p class="lead">考前只看这一页，就可以快速检查自己有没有把中断、异常、DMA、进程调度混为一谈。</p></div><div class="quick-ref">${refs.map((r,i)=>`<div class="ref-row"><strong>${String(i+1).padStart(2,'0')} · ${r[0]}</strong><p>${r[1]}</p></div>`).join('')}</div><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-primary" data-page="quiz">${ic('quiz')} 自测这些概念</button><button class="btn btn-outline" data-action="print">${ic('file')} 打印本页</button></div>`}
function render(){syncNav();const el=document.getElementById('content');el.innerHTML=route.page==='home'?homeView():route.page==='map'?mapView():route.page==='module'?moduleView(route.id):route.page==='lab'?labView():route.page==='quiz'?quizView():route.page==='wrong'?wrongView():referenceView();document.title=`${route.page==='module'?modules.find(m=>m.id===route.id)?.title:names[route.page]||'408 中断知识全景'}｜408 中断知识全景`}
function searchOpen(){document.getElementById('searchModal').classList.add('open');document.getElementById('searchInput').value='';searchResults('');setTimeout(()=>document.getElementById('searchInput').focus(),20)}
function searchClose(){document.getElementById('searchModal').classList.remove('open')}
function searchResults(value){let term=value.trim().toLowerCase();let results=modules.filter(m=>!term||(m.title+' '+m.desc+' '+m.keywords+' '+m.sections.map(x=>x[0]).join(' ')).toLowerCase().includes(term));document.getElementById('searchResults').innerHTML=results.length?results.map(m=>`<button class="search-result" data-module="${m.id}"><span><strong>${m.num} ${m.title}</strong><small>${m.desc}</small></span>${ic('arrow')}</button>`).join(''):`<div class="empty-search">没有匹配的章节。试试“中断嵌套”“缺页”或“DMA”。</div>`}
function changeAnswer(id,i){if(quiz.submitted)return;quiz.answers[id]=i;render()}
function submitQuiz(){if(quiz.submitted||Object.keys(quiz.answers).length!==quiz.ids.length)return;quiz.submitted=true;let correct=0;quiz.ids.forEach(id=>{let q=quizBank.find(x=>x.id===id);if(quiz.answers[id]===q.a){correct++;saved.wrong=saved.wrong.filter(x=>x!==id)}else if(!saved.wrong.includes(id))saved.wrong.push(id)});saved.history.push({date:new Date().toISOString(),score:Math.round(correct/quiz.ids.length*100),total:quiz.ids.length});saved.history=saved.history.slice(-30);persist();render();window.scrollTo({top:0,behavior:'smooth'});toast(`测验完成，得分 ${correct} / ${quiz.ids.length}`)}
document.addEventListener('click',function(e){let b=e.target.closest('[data-module],[data-page],[data-action]');if(!b)return;if(b.dataset.module){searchClose();changePage('module',b.dataset.module);return}if(b.dataset.page){searchClose();changePage(b.dataset.page);return}let a=b.dataset.action,id=b.dataset.id,idx=Number(b.dataset.index);switch(a){case'home':changePage('home');break;case'menu':document.getElementById('sidebar').classList.toggle('show');document.getElementById('scrim').classList.toggle('show');break;case'close-sidebar':document.getElementById('sidebar').classList.remove('show');document.getElementById('scrim').classList.remove('show');break;case'search':searchOpen();break;case'close-search':searchClose();break;case'home-flow':homeStepIndex=idx;render();break;case'toggle-done':saved.done=completed(id)?saved.done.filter(x=>x!==id):[...saved.done,id];persist();render();toast(completed(id)?'已标记为掌握':'已取消掌握标记');break;case'quiz-module':quizStart(id);break;case'scroll-section':document.getElementById('section-'+idx)?.scrollIntoView({behavior:'smooth',block:'start'});break;case'print':window.print();break;case'goto-step':stepIndex=idx;render();break;case'prev-step':stepIndex=Math.max(0,stepIndex-1);render();break;case'next-step':stepIndex=(stepIndex+1)%flowSteps.length;render();break;case'irq-type':irqType=id;render();break;case'priority':incomingPriority=Number(id);render();break;case'answer':changeAnswer(id,idx);break;case'submit-quiz':submitQuiz();break;case'quiz-restart':quizStart(quiz.filter,quiz.mode==='wrong');break;case'all-quiz':quizStart('all');break;case'retry-wrong':quizStart('all',true);break;case'remove-wrong':saved.wrong=saved.wrong.filter(x=>x!==id);persist();render();toast('已从错题本移除');break;case'clear-wrong':if(confirm('确定清空所有错题记录吗？学习进度与笔记不会删除。')){saved.wrong=[];persist();render();toast('错题记录已清空')}break;default:break}});
document.addEventListener('change',e=>{if(e.target.id==='iftoggle'){irqIF=e.target.checked;document.getElementById('irqResult').innerHTML=irqResultMarkup()}if(e.target.id==='masktoggle'){irqMasked=e.target.checked;document.getElementById('irqResult').innerHTML=irqResultMarkup()}if(e.target.id==='quizFilter'){quizStart(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){saved.notes[e.target.dataset.note]=e.target.value;persist()}if(e.target.id==='searchInput')searchResults(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}if(e.key==='Escape'){searchClose();document.getElementById('sidebar').classList.remove('show');document.getElementById('scrim').classList.remove('show')}});
document.getElementById('searchModal').addEventListener('click',e=>{if(e.target.id==='searchModal')searchClose()});
document.getElementById('searchIco').innerHTML=ic('search');document.getElementById('modalSearchIco').innerHTML=ic('search');document.getElementById('homeIco').innerHTML=ic('home');
try{let hash=location.hash.slice(1);if(hash.startsWith('chapter-')&&modules.find(m=>m.id===hash.slice(8)))route={page:'module',id:hash.slice(8)};else if(['home','map','lab','quiz','wrong','reference'].includes(hash))route={page:hash,id:null}}catch(e){}
render();
</script>
